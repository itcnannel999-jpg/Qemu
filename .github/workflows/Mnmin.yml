name: Custom Windows 7 QEMU (AMD Phenom II X6 1090T, 16GB RAM, 150GB Disk & RustDesk)

on:
  workflow_dispatch:

jobs:
  run-win7-amd:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: 1. Install QEMU, KVM & Storage Tools
        run: |
          echo "=== [STEP 1/5] Installing QEMU, KVM & Tools ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            qemu-utils \
            genisoimage \
            novnc \
            websockify \
            curl \
            wget \
            aria2 \
            pulseaudio

          echo "=== Enabling KVM Permissions ==="
          sudo chmod 666 /dev/kvm || true

          echo "=== Creating Main Virtual Disk (150GB qcow2) ==="
          qemu-img create -f qcow2 /tmp/main_disk.qcow2 150G

          echo "=== Creating Empty USB Flash Drive (32GB RAW) ==="
          qemu-img create -f raw /tmp/usb_flash_32G.img 32G

      - name: 2. Download Windows 7 ISO
        run: |
          echo "=== [STEP 2/5] Downloading Windows 7 ISO ==="
          ISO_URL="https://archive.org/download/WindowsVersionsArchive/Windows7_x64.iso"
          aria2c -x 16 -s 16 -k 1M -d /tmp -o win7.iso "$ISO_URL" || wget -O /tmp/win7.iso "$ISO_URL"
          ls -lh /tmp/win7.iso

      - name: 3. Download Browsers, RustDesk & Build Extra Software ISO
        run: |
          echo "=== [STEP 3/5] Downloading Browsers, RustDesk & Building Software ISO ==="

          FF_151_URL="https://github.com/e3kskoy7wqk/Firefox-for-windows-7/releases/download/151.0.2/firefox-151.0.2.en-US.win64.installer.exe"
          FF_115_URL="https://download.mozilla.org/?product=firefox-esr115-latest-ssl&os=win64&lang=en-GB"
          SUPERMIUM_URL="https://download.win32subsystem.live/supermium/releases/v150-r2.02/supermium_150_64_setup.exe"
          RUSTDESK_URL="https://github.com/rustdesk/rustdesk/releases/download/1.5.3/rustdesk-1.5.3-x86_64.exe"

          mkdir -p /tmp/custom_iso/Browsers /tmp/custom_iso/RemoteDesktop

          echo "Downloading Firefox 151.0.2..."
          wget -U "Mozilla/5.0 (Windows NT 6.1; Win64; x64)" -O /tmp/custom_iso/Browsers/Firefox_151_0_2_Setup.exe "$FF_151_URL" || true

          echo "Downloading Firefox ESR 115 (backup)..."
          wget -L -U "Mozilla/5.0 (Windows NT 6.1; Win64; x64)" -O /tmp/custom_iso/Browsers/Firefox_ESR_115_Setup.exe "$FF_115_URL" || true

          echo "Downloading Supermium 150 (backup browser)..."
          wget -U "Mozilla/5.0 (Windows NT 6.1; Win64; x64)" -O /tmp/custom_iso/Browsers/Supermium_150_64_Setup.exe "$SUPERMIUM_URL" || true

          echo "Downloading RustDesk 1.5.3..."
          wget -U "Mozilla/5.0 (Windows NT 6.1; Win64; x64)" -O /tmp/custom_iso/RemoteDesktop/RustDesk_1_5_3_x86_64.exe "$RUSTDESK_URL" || true

          echo "Generating Software CD-ROM ISO..."
          genisoimage -o /tmp/software.iso -R -J /tmp/custom_iso
          ls -lh /tmp/software.iso

      - name: 4. Connect Tailscale
        run: |
          echo "=== [STEP 4/5] Connecting Tailscale ==="
          curl -fsSL https://tailscale.com/install.sh | sh

          AUTH_KEY="${{ secrets.TAILSCALE_AUTHKEY }}"

          if [ -n "$AUTH_KEY" ]; then
            sudo tailscale up --authkey="$AUTH_KEY" --hostname="win7-amd-runner-${{ github.run_id }}" --accept-routes || true
          fi

          TS_IP=$(tailscale ip -4 || true)
          if [ -z "$TS_IP" ]; then
            timeout 15s sudo tailscale up --hostname="win7-amd-runner-${{ github.run_id }}" --accept-routes || true
            sudo tailscale up --hostname="win7-amd-runner-${{ github.run_id }}" --accept-routes > /dev/null 2>&1 &

            RETRIES=0
            while [ -z "$TS_IP" ] && [ $RETRIES -lt 60 ]; do
                TS_IP=$(tailscale ip -4 || true)
                sleep 3
                RETRIES=$((RETRIES+1))
            done
          fi

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Tailscale failed to get IP!"
            exit 1
          fi

          echo "Tailscale IP: $TS_IP"
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: 5. Launch QEMU Windows 7 & noVNC Web Access
        run: |
          echo "=== [STEP 5/5] Starting QEMU Windows 7 Machine ==="

          CURRENT_IP="${{ env.TAILSCALE_IP }}"
          if [ -z "$CURRENT_IP" ]; then
            CURRENT_IP=$(tailscale ip -4 || echo "127.0.0.1")
          fi

          export QEMU_AUDIO_DRV=none

          # Запуск QEMU: AMD Phenom II X6 1090T (2010, без графики), 16GB RAM, диск 150ГБ, флешка 32ГБ, аудио и софт на CD-ROM
          qemu-system-x86_64 \
            -enable-kvm \
            -m 16384 \
            -smp 6,sockets=1,cores=6,threads=1 \
            -cpu host,vendor=AuthenticAMD,model-id="AMD Phenom(tm) II X6 1090T Processor",check=false \
            -drive file=/tmp/main_disk.qcow2,format=qcow2,index=0,media=disk \
            -drive file=/tmp/win7.iso,index=1,media=cdrom \
            -drive file=/tmp/software.iso,index=2,media=cdrom \
            -drive file=/tmp/usb_flash_32G.img,format=raw,if=none,id=usbdrive \
            -device qemu-xhci,id=xhci \
            -device usb-storage,bus=xhci.0,drive=usbdrive,removable=true \
            -device intel-hda \
            -device hda-duplex \
            -vga std \
            -boot d \
            -vnc 127.0.0.1:0 \
            -net nic,model=e1000 \
            -net user \
            -usb -device usb-mouse -device usb-tablet \
            -daemonize

          sleep 5

          NOVNC_DIR="/usr/share/novnc"
          websockify --web "$NOVNC_DIR" --heartbeat=10 8006 127.0.0.1:5900 &
          sleep 2

          echo "=================================================="
          echo " WINDOWS 7 QEMU READY (AMD PHENOM II X6 1090T)"
          echo "=================================================="
          echo " OS Image       : Windows 7 x64"
          echo " CPU Model      : AMD Phenom(tm) II X6 1090T Processor (2010, 6 Cores)"
          echo " RAM            : 16 GB (16384 MB)"
          echo " Main Storage   : 150 GB"
          echo " Removable USB  : 32 GB Flash Drive"
          echo " Audio Device   : Intel HD Audio (hda-duplex)"
          echo " Software CD    : Firefox 151.0.2, ESR 115, Supermium 150, RustDesk 1.5.3"
          echo " Tailscale IP   : $CURRENT_IP"
          echo " Web VNC URL    : http://$CURRENT_IP:8006/vnc.html"
          echo "=================================================="

          END_TIME=$(( $(date +%s) + 21600 ))
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 300
            echo "QEMU Running | Tailscale IP: $CURRENT_IP | $(date)"
          done
