name: macOS Runner with noVNC & Tailscale

on:
  workflow_dispatch:

jobs:
  run-macos-runner:
    runs-on: macos-latest

    steps:
      - name: Install Tailscale & Git
        run: |
          brew install tailscale git

      - name: Start Tailscale Service
        run: |
          sudo brew services start tailscale
          sleep 3

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=gh-runner-macos --accept-routes
          
          TS_IP=""
          for i in {1..15}; do
            TS_IP=$(tailscale ip -4 2>/dev/null || true)
            if [ -n "$TS_IP" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$TS_IP" ]; then
            echo "Error: Failed to get Tailscale IP."
            exit 1
          fi
          
          echo "TS_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale IP: $TS_IP"

      - name: Set Runner Password
        run: |
          sudo sysadminctl -adminUser runner -adminPassword "" -setPassword -user runner -newPassword "password123" || true

      - name: Enable macOS Screen Sharing (VNC)
        run: |
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          sudo launchctl kickstart -k system/com.apple.screensharing || true

      - name: Setup noVNC and Start Web Access
        run: |
          # Устанавливаем websockify через pip с обходом системных ограничений
          pip3 install websockify --break-system-packages
          
          # Скачиваем официальный noVNC клиент
          git clone https://github.com/novnc/noVNC.git /tmp/novnc
          
          # Запускаем websockify, проксируя порт 8080 на системный VNC порт macOS (5900)
          websockify --web=/tmp/novnc 8080 localhost:5900 &

      - name: Connection Details & Keep Alive
        run: |
          echo "=== MACOS RUNNER (noVNC) ACCESS ==="
          echo "Open this link in your browser (via Tailscale):"
          echo "http://${{ env.TS_IP }}:8080/vnc.html?host=${{ env.TS_IP }}&port=8080"
          echo ""
          echo "Username: runner"
          echo "Password: password123"
          echo "==================================="
          sleep 21600
