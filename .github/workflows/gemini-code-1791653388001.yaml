- name: Start Windows 10 Enterprise Container
        run: |
          docker run -d \
            --name windows-vm \
            -e "VERSION=10e" \
            -e "CPU_CORES=${{ inputs.cpu_cores }}" \
            -e "RAM_SIZE=${{ inputs.ram_size }}" \
            -p 8006:8006 \
            -p 3389:3389/tcp \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            --stop-timeout 120 \
            dockurr/windows